name: RmR freestanding shape contract

on:
  pull_request:
    paths:
      - 'rmr/rmr-core/**'
      - '.github/workflows/rmr-freestanding-contract.yml'
  push:
    branches: ['androidx-main']
    paths:
      - 'rmr/rmr-core/**'
      - '.github/workflows/rmr-freestanding-contract.yml'

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute fail-closed C11 shape gate
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -ffreestanding -fno-builtin -O2 -Wall -Wextra -Werror -pedantic \
            rmr/rmr-core/src/test/native/rmr_matrix_contract_test.c -o /tmp/rmr-matrix-contract-test
          /tmp/rmr-matrix-contract-test

      - name: Host test for scalar fallback, tails, and no-overwrite
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -ffreestanding -fno-builtin -O2 -Wall -Wextra -Werror -pedantic \
            rmr/rmr-core/src/test/native/rmr_zero_f64_test.c -o /tmp/rmr-zero-f64-host
          /tmp/rmr-zero-f64-host

      - name: Cross-compile real ARMv7 NEON and AArch64 inline assembly
        shell: bash
        run: |
          set -euo pipefail
          clang --target=armv7a-linux-androideabi21 -march=armv7-a \
            -mfpu=neon -mfloat-abi=softfp -std=c11 \
            -ffreestanding -fno-builtin -O2 -Wall -Wextra -Werror -pedantic \
            -c rmr/rmr-core/src/test/native/rmr_zero_f64_test.c \
            -o /tmp/rmr-zero-f64-armeabi-v7a.o
          clang --target=aarch64-linux-android21 -std=c11 \
            -ffreestanding -fno-builtin -O2 -Wall -Wextra -Werror -pedantic \
            -c rmr/rmr-core/src/test/native/rmr_zero_f64_test.c \
            -o /tmp/rmr-zero-f64-arm64-v8a.o
          test -s /tmp/rmr-zero-f64-armeabi-v7a.o
          test -s /tmp/rmr-zero-f64-arm64-v8a.o

      - name: Cross-compile C++17 consumer for JNI bridge compatibility
        shell: bash
        run: |
          set -euo pipefail
          clang++ --target=armv7a-linux-androideabi21 -march=armv7-a \
            -mfpu=neon -mfloat-abi=softfp -std=c++17 \
            -ffreestanding -fno-builtin -fno-exceptions -fno-rtti \
            -O3 -Wall -Wextra -Werror -pedantic \
            -c rmr/rmr-core/src/test/native/rmr_zero_f64_cpp_smoke.cpp \
            -o /tmp/rmr-zero-f64-cxx-armv7.o
          clang++ --target=aarch64-linux-android21 -std=c++17 \
            -ffreestanding -fno-builtin -fno-exceptions -fno-rtti \
            -O3 -Wall -Wextra -Werror -pedantic \
            -c rmr/rmr-core/src/test/native/rmr_zero_f64_cpp_smoke.cpp \
            -o /tmp/rmr-zero-f64-cxx-arm64.o
          test -s /tmp/rmr-zero-f64-cxx-armv7.o
          test -s /tmp/rmr-zero-f64-cxx-arm64.o
