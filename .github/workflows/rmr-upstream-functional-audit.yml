name: RmR upstream functional audit

on:
  pull_request:
    paths:
      - "rmr/**"
      - "docs/RMR_*.md"
      - "docs/UPSTREAM_DRIFT_LOG.md"
      - ".github/workflows/rmr-*.yml"
      - ".github/workflows/rmr-*.yaml"
      - "settings.gradle"
      - "settings.gradle.kts"
  push:
    branches: ["**"]
    paths:
      - "rmr/**"
      - "docs/RMR_*.md"
      - "docs/UPSTREAM_DRIFT_LOG.md"
      - ".github/workflows/rmr-*.yml"
      - ".github/workflows/rmr-*.yaml"
      - "settings.gradle"
      - "settings.gradle.kts"
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "AndroidX upstream branch to compare"
        required: false
        default: "androidx-main"
        type: string
      native_abis:
        description: "Comma-separated native ABIs for release AARs"
        required: false
        default: "arm64-v8a"
        type: string

permissions:
  contents: read

concurrency:
  group: rmr-upstream-functional-audit-${{ github.ref }}
  # Superseded PR heads must not consume the evidence lane; scheduled and push
  # audits remain non-destructive.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'androidx-main' }}
      RMR_NATIVE_ABIS: ${{ inputs.native_abis || 'arm64-v8a' }}
      RMR_GRADLE_JVM_ARGS: "-Xms1g -Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
      RMR_GRADLE_WORKERS: "2"
      # The GitHub clone does not contain AndroidX's local prebuilts tree.
      # settings.gradle explicitly opts into the public repositories with this flag.
      ALLOW_PUBLIC_REPOS: "true"
      # Public CI must not attempt the AndroidX Google-internal remote cache.
      USE_ANDROIDX_REMOTE_BUILD_CACHE: "false"
      # This upstream setting allows a targeted build in a partial public checkout.
      # It does not supply missing projects or turn their dependencies into passes.
      ALLOW_MISSING_PROJECTS: "true"
      # settings.gradle supports this filter; it prevents unrelated AOSP sibling
      # projects such as external/icing from entering an RmR-only CI invocation.
      PROJECT_PREFIX: ":rmr"
    steps:
      - name: Checkout complete history for merge-base analysis
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize audit workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rmr-upstream-audit"
          printf 'AUDIT_DIR=%s\n' "${RUNNER_TEMP}/rmr-upstream-audit" >> "${GITHUB_ENV}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "${android_sdk_root}"
          sdkmanager_bin="${android_sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          test -x "${sdkmanager_bin}"
          # sdkmanager exits after consuming its input; ignore the expected SIGPIPE
          # from yes while still failing when sdkmanager itself fails.
          set +o pipefail
          yes 2>/dev/null | sudo "${sdkmanager_bin}" --install "ndk;28.2.13676358" "cmake;3.18.1"
          set -o pipefail
          ndk_root="${android_sdk_root}/ndk/28.2.13676358"
          test -x "${ndk_root}/ndk-build"
          test -d "${android_sdk_root}/cmake/3.18.1"
          # Keep sdkmanager and Gradle's local.properties generator on the
          # exact same SDK root instead of relying on a runner-image alias.
          printf 'ANDROID_SDK_ROOT=%s\\n' "${android_sdk_root}" >> "${GITHUB_ENV}"
          printf 'ANDROID_HOME=%s\\n' "${android_sdk_root}" >> "${GITHUB_ENV}"
          printf 'ANDROID_NDK_HOME=%s\n' "${ndk_root}" >> "${GITHUB_ENV}"
          printf 'ANDROID_NDK_ROOT=%s\n' "${ndk_root}" >> "${GITHUB_ENV}"

      - name: Verify Gradle SDK and NDK discovery
        shell: bash
        run: |
          set -euo pipefail
          bash development/write_sdk_path.sh
          grep -Fqx "sdk.dir=${ANDROID_SDK_ROOT}" local.properties
          test -x "${ANDROID_NDK_HOME}/ndk-build"

      - name: Record partial AndroidX checkout topology
        shell: bash
        run: |
          set -euo pipefail
          external_icing="absent"
          if [[ -d "${GITHUB_WORKSPACE}/../../external/icing" ]]; then
            external_icing="present"
          fi
          printf '{"aosp_external_icing":"%s","allow_missing_projects":"true","project_prefix":":rmr","ndk_version":"28.2.13676358","cmake_version":"3.18.1"}\n' "${external_icing}" > "${AUDIT_DIR}/ci_environment.json"

      - name: Record the checked-in RmR fork boundary
        run: |
          python3 rmr/scripts/audit_androidx_upstream.py \
            --upstream-ref "${UPSTREAM_REF}" \
            --out-dir "${AUDIT_DIR}"

      - name: Build every declared RmR release AAR
        id: build_rmr
        continue-on-error: true
        run: |
          bash rmr/scripts/build_rmr_release.sh

      - name: Execute the documented RmR unit-test entrypoints
        id: rmr_tests
        if: ${{ steps.build_rmr.outcome == 'success' }}
        continue-on-error: true
        run: |
          ./gradlew --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="${RMR_GRADLE_JVM_ARGS}" \
            -Dorg.gradle.workers.max="${RMR_GRADLE_WORKERS}" \
            -PrmrNativeAbis="${RMR_NATIVE_ABIS}" \
            :rmr:rmr-core:test \
            :rmr:rafaelia:test

      - name: Record release and test observations in the audit
        if: always()
        env:
          BUILD_OBSERVATION: ${{ steps.build_rmr.outcome == 'success' && 'PASSED' || 'FAILED' }}
          TEST_OBSERVATION: ${{ steps.rmr_tests.outcome == 'success' && 'PASSED' || steps.rmr_tests.outcome == 'failure' && 'FAILED' || 'TOKEN_VAZIO' }}
        run: |
          python3 rmr/scripts/audit_androidx_upstream.py \
            --upstream-ref "${UPSTREAM_REF}" \
            --skip-fetch \
            --artifact-root rmr \
            --out-dir "${AUDIT_DIR}" \
            --observation rmr_release_aar_build="${BUILD_OBSERVATION}" \
            --observation rmr_core_tests="${TEST_OBSERVATION}" \
            --observation rafaelia_tests="${TEST_OBSERVATION}"

      - name: Enforce recorded boundary and whitespace policy
        id: boundary_policy
        if: always()
        continue-on-error: true
        run: |
          python3 rmr/scripts/audit_androidx_upstream.py \
            --upstream-ref "${UPSTREAM_REF}" \
            --skip-fetch \
            --enforce-boundary \
            --fail-on-whitespace \
            --artifact-root rmr \
            --out-dir "${AUDIT_DIR}/policy"

      - name: Fail closed when functional proof or policy gate is incomplete
        if: ${{ steps.build_rmr.outcome != 'success' || steps.rmr_tests.outcome != 'success' || steps.boundary_policy.outcome != 'success' }}
        run: |
          echo "RmR functional evidence or upstream-boundary policy is incomplete; inspect the uploaded audit artifact."
          exit 1

      - name: Upload upstream delta, test evidence, and AAR inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmr-upstream-functional-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rmr-upstream-audit/
            rmr/**/build/outputs/aar/*.aar
          if-no-files-found: warn
          retention-days: 30