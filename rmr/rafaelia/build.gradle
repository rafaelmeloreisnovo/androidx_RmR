plugins {
    id("AndroidXPlugin")
    id("com.android.library")
    id("kotlin-android")
}

android {
    namespace "androidx.rmr.rafaelia"

    // Required for AGP 9+ when using buildConfigField declarations.
    buildFeatures {
        buildConfig = true
    }

    def fastMathEnabled = project.findProperty("rmrFastMath")?.toString()?.toBoolean() ?: false
    def mathFlag = fastMathEnabled ? "-ffast-math" : "-fno-fast-math"
    def configuredAbis = (project.findProperty("rmrNativeAbis")?.toString() ?: "arm64-v8a")
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
    
    // Enable native code compilation for bare-metal performance
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.18.1"
        }
    }
    
    defaultConfig {
        consumerProguardFiles "consumer-proguard-rules.pro"
        testInstrumentationRunner = "androidx.benchmark.junit4.AndroidBenchmarkRunner"
        // Build for arm64 by default; opt-in extra ABIs via -PrmrNativeAbis=arm64-v8a,x86_64
        ndk {
            abiFilters.addAll(configuredAbis)
        }
        
        externalNativeBuild {
            cmake {
                // Maximum bare-metal optimization flags
                cppFlags "-std=c++20 -O3 ${mathFlag} -funroll-loops -fno-rtti -fno-exceptions"
                
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_TOOLCHAIN=clang",
                          "-DANDROID_PLATFORM=android-21"
            }
        }
        
        // Add build config field for usage validation
        buildConfigField "String", "AUTHORIZED_USER", "\"Rafael Melo Reis\""
        buildConfigField "boolean", "ENFORCE_RESTRICTIONS", "true"
    }
    
    buildTypes {
        release {
            // Maximum optimization for release builds
            externalNativeBuild {
                cmake {
                    cppFlags "-std=c++20 -O3 ${mathFlag} -funroll-loops -flto -fno-rtti -fno-exceptions"
                }
            }
            minifyEnabled false
        }
    }
}

dependencies {
    // Zero external dependencies - completely self-contained
    implementation(libs.androidx.annotation)
    
    // Test dependencies only
    testImplementation(libs.junit)
    androidTestImplementation(libs.junit)
    androidTestImplementation(project(":benchmark:benchmark-junit4"))
    androidTestImplementation(libs.testRunner)
}

androidx {
    name = "AndroidX RmR Rafaelia"
    inceptionYear = "2026"
    description = "Ultra low-level bare-metal optimization module with strict usage restrictions for personal use"
}
