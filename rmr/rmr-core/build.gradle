plugins {
    id("AndroidXPlugin")
    id("com.android.library")
    id("kotlin-android")
}

android {
    namespace "androidx.rmr.core"
    
    // Enable native code compilation
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.18.1"
        }
    }
    
    defaultConfig {
        // Build for all major architectures
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        
        externalNativeBuild {
            cmake {
                // Enable SIMD optimizations
                cppFlags "-std=c++17 -O3 -ffast-math -funroll-loops"
                
                // Architecture-specific flags are in CMakeLists.txt
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }
    
    buildTypes {
        release {
            // Enable additional optimizations for release builds
            externalNativeBuild {
                cmake {
                    cppFlags "-std=c++17 -O3 -ffast-math -funroll-loops -flto"
                }
            }
        }
    }
}

dependencies {
    // Minimal dependencies - only core AndroidX
    implementation(libs.androidx.annotation)
    
    // Test dependencies
    androidTestImplementation(libs.junit)
    androidTestImplementation(libs.testRunner)
}

androidx {
    name = "AndroidX RmR Core"
    inceptionYear = "2026"
    description = "Optimized matrix-based core utilities for minimal footprint and high performance"
}
