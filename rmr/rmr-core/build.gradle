plugins {
    id("AndroidXPlugin")
    id("com.android.library")
    id("kotlin-android")
}

android {
    namespace "androidx.rmr.core"

    def fastMathEnabled = project.findProperty("rmrFastMath")?.toString()?.toBoolean() ?: false
    def mathFlag = fastMathEnabled ? "-ffast-math" : "-fno-fast-math"
    def configuredAbis = (project.findProperty("rmrNativeAbis")?.toString() ?: "arm64-v8a")
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
    
    // Enable native code compilation
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.18.1"
        }
    }
    
    defaultConfig {
        consumerProguardFiles "consumer-proguard-rules.pro"
        // Build for arm64 by default; opt-in extra ABIs via -PrmrNativeAbis=arm64-v8a,x86_64
        ndk {
            abiFilters.addAll(configuredAbis)
        }
        
        externalNativeBuild {
            cmake {
                // Enable SIMD optimizations
                cppFlags "-std=c++17 -O3 ${mathFlag} -funroll-loops"
                
                // Architecture-specific flags are in CMakeLists.txt
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }
    
    buildTypes {
        release {
            // Enable additional optimizations for release builds
            externalNativeBuild {
                cmake {
                    cppFlags "-std=c++17 -O3 ${mathFlag} -funroll-loops -flto"
                }
            }
        }
    }
}

dependencies {
    // Minimal dependencies - only core AndroidX
    implementation(libs.androidx.annotation)
    
    // Test dependencies
    testImplementation(libs.junit)
    androidTestImplementation(libs.junit)
    androidTestImplementation(libs.testRunner)
}

androidx {
    name = "AndroidX RmR Core"
    inceptionYear = "2026"
    description = "Optimized matrix-based core utilities for minimal footprint and high performance"
}
